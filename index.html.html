<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App System Blueprint</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="flex h-screen bg-[#f5f5f7] font-sans text-[#1d1d1f] antialiased selection:bg-[#0071e3] selection:text-white overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-72 bg-white/70 backdrop-blur-2xl border-r border-black/5 flex flex-col shrink-0 z-30 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-8 pb-6">
            <div class="w-10 h-10 bg-[#1d1d1f] rounded-xl flex items-center justify-center text-white mb-4 shadow-lg shadow-black/20">
                <i data-lucide="box" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-semibold tracking-tight mb-1">Delivery App</h1>
            <p class="text-[12px] font-medium text-[#86868b] uppercase tracking-widest">System Blueprint</p>
        </div>
        
        <nav class="flex-1 overflow-y-auto px-4 py-2 space-y-8 custom-scrollbar">
            <!-- Project Section -->
            <div>
                <div class="px-4 text-[11px] font-semibold text-[#86868b] uppercase tracking-wider mb-2">Project</div>
                <div class="space-y-1">
                    <button onclick="switchMainView('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium bg-black/5 text-[#1d1d1f]">
                        <i data-lucide="layers" class="w-[18px] h-[18px] text-[#1d1d1f]"></i>
                        Architecture Overview
                    </button>
                    <button onclick="switchMainView('tech')" id="nav-tech" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium text-[#515154] hover:bg-black/[0.03] hover:text-[#1d1d1f]">
                        <i data-lucide="code" class="w-[18px] h-[18px] text-[#86868b]"></i>
                        Technology Stack
                    </button>
                </div>
            </div>

            <!-- Applications Section -->
            <div>
                <div class="px-4 text-[11px] font-semibold text-[#86868b] uppercase tracking-wider mb-2">Applications</div>
                <div id="app-nav-list" class="space-y-1">
                    <!-- Populated via JavaScript -->
                </div>
            </div>
        </nav>

        <div class="p-6 text-center">
            <p class="text-[11px] font-medium text-[#86868b] uppercase tracking-widest">Confidential V1.0</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        <div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-black/[0.02] to-transparent pointer-events-none z-0"></div>

        <div id="main-content-container" class="flex-1 overflow-y-auto p-10 pt-12 relative z-10 custom-scrollbar">
            <!-- Dynamic View Injected Here -->
        </div>
    </main>

    <!-- JavaScript Logic & Data -->
    <script>
        const TECH_STACK = [
            {
                category: "Frontend & Mobile",
                icon: "smartphone",
                color: "text-blue-500",
                bg: "bg-blue-500/10",
                items: [
                    { name: "React Native", desc: "Cross-platform mobile apps (Customer, Driver, Restaurant)" },
                    { name: "React.js", desc: "Web applications & Admin Dashboard" },
                    { name: "Tailwind CSS", desc: "Utility-first styling system" },
                    { name: "Zustand/Redux", desc: "Global state management" }
                ]
            },
            {
                category: "Backend & API",
                icon: "server",
                color: "text-green-500",
                bg: "bg-green-500/10",
                items: [
                    { name: "Node.js & Express", desc: "Primary API microservices" },
                    { name: "Socket.io", desc: "Real-time bidirectional communication" },
                    { name: "GraphQL", desc: "Efficient data querying for mobile" },
                    { name: "NestJS", desc: "Scalable enterprise architecture" }
                ]
            },
            {
                category: "Infrastructure & Data",
                icon: "database",
                color: "text-purple-500",
                bg: "bg-purple-500/10",
                items: [
                    { name: "PostgreSQL", desc: "Primary relational database" },
                    { name: "Redis", desc: "Caching and pub/sub for real-time tracking" },
                    { name: "MongoDB", desc: "Unstructured data and logs" },
                    { name: "AWS ECS/EKS", desc: "Container orchestration & scaling" }
                ]
            },
            {
                category: "Third-Party Services",
                icon: "globe",
                color: "text-orange-500",
                bg: "bg-orange-500/10",
                items: [
                    { name: "Google Maps API", desc: "Routing, geocoding, and live tracking" },
                    { name: "Stripe / Razorpay", desc: "Secure payment processing" },
                    { name: "Twilio / Firebase", desc: "SMS OTP and Push Notifications" },
                    { name: "Datadog / Sentry", desc: "Monitoring and error tracking" }
                ]
            }
        ];

        const APP_DATA = [
            {
                id: 'customer',
                name: 'Customer App',
                icon: 'smartphone',
                deviceType: 'mobile',
                pages: [
                    { id: 'c1', name: 'Splash & Onboarding', template: 'auth', complexity: 'Simple', features: ['Brand Logo Intro', 'Feature Carousel', 'Location Permission Prompt'], services: ['App Config API'] },
                    { id: 'c2', name: 'Phone Login & OTP', template: 'auth', complexity: 'Moderate', features: ['Phone Number Input', 'Auto-read SMS', 'Session Token Generation'], services: ['Auth Service', 'SMS Gateway', 'User DB'] },
                    { id: 'c3', name: 'Home (Feed)', template: 'feed', complexity: 'Complex', features: ['Dynamic Banners', 'Cuisine Filters', 'Nearby Restaurants Feed', 'Infinite Scroll'], services: ['Catalog Service', 'Recommendation Engine', 'Geo-Spatial Query'] },
                    { id: 'c4', name: 'Search & Explore', template: 'feed', complexity: 'Complex', features: ['Recent Searches', 'Trending Tags', 'Typeahead suggestions', 'Dish vs Restaurant tabs'], services: ['ElasticSearch', 'Analytics DB'] },
                    { id: 'c5', name: 'Restaurant Detail', template: 'detail', complexity: 'Complex', features: ['Hero Image & Meta', 'Sticky Menu Categories', 'Veg-only Toggle', 'Item Customization (Add-ons)'], services: ['Catalog Service', 'Pricing Engine'] },
                    { id: 'c6', name: 'Cart View', template: 'list', complexity: 'Moderate', features: ['Item List', 'Apply Coupon Code', 'Bill Breakdown (Taxes, Delivery)', 'Checkout Button'], services: ['Cart Service', 'Promo Engine'] },
                    { id: 'c7', name: 'Checkout & Payments', template: 'list', complexity: 'Complex', features: ['Saved Addresses', 'Add New Address (Map)', 'Payment Method Select', 'UPI/Card flow'], services: ['Payment Gateway', 'Order Orchestrator', 'User Profile'] },
                    { id: 'c8', name: 'Order Tracking (Live)', template: 'map', complexity: 'Complex', features: ['Live Map Canvas', 'Driver Icon Movement', 'Dynamic ETA', 'Call/Chat with Driver'], services: ['Socket Engine', 'Google Maps API', 'Order DB'] },
                    { id: 'c9', name: 'User Profile', template: 'list', complexity: 'Simple', features: ['Order History', 'Saved Addresses', 'Payment Methods', 'Help & Support'], services: ['User Service', 'Support Ticketing'] }
                ]
            },
            {
                id: 'restaurant',
                name: 'Restaurant App',
                icon: 'store',
                deviceType: 'mobile',
                pages: [
                    { id: 'r1', name: 'Partner Login', template: 'auth', complexity: 'Simple', features: ['Vendor ID Input', 'Password/OTP', 'Forgot Password'], services: ['Vendor Auth Service'] },
                    { id: 'r2', name: 'Live Dashboard', template: 'dashboard', complexity: 'Complex', features: ['Master Online/Offline Toggle', 'Today Earnings', 'Active Orders Count', 'Revenue Chart'], services: ['Vendor Analytics', 'Order Engine'] },
                    { id: 'r3', name: 'Incoming Order Alert', template: 'auth', complexity: 'Moderate', features: ['Full-screen Ring', 'Accept/Reject Buttons', 'Item Preview', 'Prep Time Selection'], services: ['Socket Engine', 'Push Notifications'] },
                    { id: 'r4', name: 'Order Management', template: 'list', complexity: 'Moderate', features: ['Tabs: New, Prep, Ready', 'Mark as Ready Button', 'Driver Assingment Status'], services: ['Order DB', 'State Machine'] },
                    { id: 'r5', name: 'Menu Management', template: 'list', complexity: 'Complex', features: ['Category List', 'Item Stock Toggle (In/Out)', 'Price Editor', 'Add-on Management'], services: ['Catalog Service'] }
                ]
            },
            {
                id: 'delivery',
                name: 'Delivery App',
                icon: 'bike',
                deviceType: 'mobile',
                pages: [
                    { id: 'd1', name: 'Rider Login & KYC', template: 'auth', complexity: 'Moderate', features: ['Mobile Login', 'Document Upload (DL, Aadhar)', 'Selfie Verification'], services: ['Driver Auth', 'KYC Verification 3rd Party'] },
                    { id: 'd2', name: 'Availability Dashboard', template: 'feed', complexity: 'Moderate', features: ['Go Online Swipe', 'Current Zone Heatmap', 'Today Earnings', 'Shift Status'], services: ['Driver State Service', 'Geo-Spatial Engine'] },
                    { id: 'd3', name: 'New Delivery Alert', template: 'map', complexity: 'Moderate', features: ['Pickup/Drop distance', 'Estimated Earning', 'Accept Countdown Timer'], services: ['Dispatch Engine', 'Socket Engine'] },
                    { id: 'd4', name: 'Navigation & Handover', template: 'map', complexity: 'Complex', features: ['Turn-by-turn route', 'Call Restaurant/Customer', 'Mark Picked Up', 'Customer OTP Verification'], services: ['Google Maps Routing', 'Order State Machine'] },
                    { id: 'd5', name: 'Earnings History', template: 'list', complexity: 'Simple', features: ['Daily/Weekly Payouts', 'Trip Breakdown', 'Incentive Tracker'], services: ['Payout Engine'] }
                ]
            },
            {
                id: 'admin',
                name: 'Admin Dashboard',
                icon: 'monitor',
                deviceType: 'desktop',
                pages: [
                    { id: 'a1', name: 'Admin Secure Login', template: 'auth', complexity: 'Simple', features: ['Email/Password', '2FA Entry', 'Role-based access'], services: ['Admin Auth Service'] },
                    { id: 'a2', name: 'Overview Analytics', template: 'dashboard', complexity: 'Complex', features: ['Live KPI Cards', 'Revenue Timeline Chart', 'Platform GMV', 'Active Users'], services: ['Data Warehouse', 'Analytics Engine'] },
                    { id: 'a3', name: 'Live Order Monitoring', template: 'map', complexity: 'Complex', features: ['City-wide Map View', 'Active Rider Pins', 'Delayed Order Alerts', 'Manual Dispatch Override'], services: ['Geo-Spatial Engine', 'Dispatch System'] },
                    { id: 'a4', name: 'User & Vendor Management', template: 'list', complexity: 'Moderate', features: ['Data Tables with Search/Filter', 'Block/Unblock', 'Commission Adjustments', 'KYC Approvals'], services: ['User/Vendor DBs', 'Admin Action Logs'] },
                    { id: 'a5', name: 'Serviceability Zones', template: 'map', complexity: 'Complex', features: ['Polygon Drawing Tool', 'Surge Pricing Config per zone', 'Delivery Radius Settings'], services: ['Geo-Spatial DB', 'Pricing Engine'] }
                ]
            }
        ];

        let currentMainView = 'overview';
        let activeAppId = APP_DATA[0].id;
        let activePageId = APP_DATA[0].pages[0].id;

        function renderAppNav() {
            const container = document.getElementById('app-nav-list');
            container.innerHTML = APP_DATA.map(app => {
                const isActive = currentMainView === 'wireframes' && activeAppId === app.id;
                return `
                    <button onclick="navigateToWireframe('${app.id}')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium ${isActive ? 'bg-[#0071e3]/10 text-[#0071e3]' : 'text-[#515154] hover:bg-black/[0.03] hover:text-[#1d1d1f]'}">
                        <i data-lucide="${app.icon}" class="w-[18px] h-[18px] ${isActive ? 'text-[#0071e3]' : 'text-[#86868b]'}"></i>
                        ${app.name}
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function switchMainView(view) {
            currentMainView = view;
            document.getElementById('nav-overview').className = `w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium ${view === 'overview' ? 'bg-black/5 text-[#1d1d1f]' : 'text-[#515154] hover:bg-black/[0.03] hover:text-[#1d1d1f]'}`;
            document.getElementById('nav-overview').querySelector('i').className = `w-[18px] h-[18px] ${view === 'overview' ? 'text-[#1d1d1f]' : 'text-[#86868b]'}`;
            
            document.getElementById('nav-tech').className = `w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium ${view === 'tech' ? 'bg-black/5 text-[#1d1d1f]' : 'text-[#515154] hover:bg-black/[0.03] hover:text-[#1d1d1f]'}`;
            document.getElementById('nav-tech').querySelector('i').className = `w-[18px] h-[18px] ${view === 'tech' ? 'text-[#1d1d1f]' : 'text-[#86868b]'}`;

            renderAppNav();
            renderContent();
        }

        function navigateToWireframe(appId) {
            activeAppId = appId;
            const app = APP_DATA.find(a => a.id === appId);
            activePageId = app.pages[0].id;
            currentMainView = 'wireframes';
            
            document.getElementById('nav-overview').className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium text-[#515154] hover:bg-black/[0.03] hover:text-[#1d1d1f]";
            document.getElementById('nav-overview').querySelector('i').className = "w-[18px] h-[18px] text-[#86868b]";
            document.getElementById('nav-tech').className = "w-full flex items-center gap-3 px-4 py-2.5 rounded-xl transition-all duration-200 text-[14px] font-medium text-[#515154] hover:bg-black/[0.03] hover:text-[#1d1d1f]";
            document.getElementById('nav-tech').querySelector('i').className = "w-[18px] h-[18px] text-[#86868b]";

            renderAppNav();
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('main-content-container');
            if (currentMainView === 'overview') {
                container.innerHTML = renderOverviewView();
            } else if (currentMainView === 'tech') {
                container.innerHTML = renderTechView();
            } else if (currentMainView === 'wireframes') {
                container.innerHTML = renderWireframesView();
            }
            lucide.createIcons();
        }

        function renderOverviewView() {
            return `
                <div class="max-w-6xl mx-auto animate-in pb-16">
                    <div class="mb-12">
                        <h2 class="text-3xl font-semibold tracking-tight text-[#1d1d1f] mb-3">Platform Architecture</h2>
                        <p class="text-[#86868b] text-[15px] max-w-2xl leading-relaxed">
                            A high-level view of the four primary applications that make up the delivery ecosystem, showing the hierarchy of core user journeys.
                        </p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${APP_DATA.map(app => `
                            <div class="bg-white rounded-3xl p-8 border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden group hover:shadow-[0_8px_40px_rgb(0,0,0,0.08)] transition-shadow duration-300">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-black/5 to-transparent rounded-bl-full -mr-8 -mt-8 pointer-events-none opacity-50 group-hover:scale-110 transition-transform duration-500"></div>
                                <div class="flex items-center gap-4 mb-8 relative z-10">
                                    <div class="w-12 h-12 rounded-2xl bg-[#f5f5f7] flex items-center justify-center text-[#1d1d1f] shadow-sm border border-black/5">
                                        <i data-lucide="${app.icon}" class="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-semibold tracking-tight">${app.name}</h3>
                                        <span class="text-[13px] font-medium text-[#86868b] uppercase tracking-wider">${app.deviceType}</span>
                                    </div>
                                </div>
                                <div class="relative pl-6 border-l-2 border-[#f5f5f7] space-y-6">
                                    ${app.pages.slice(0, 5).map(page => `
                                        <div class="relative">
                                            <div class="absolute w-6 h-0.5 bg-[#f5f5f7] -left-6 top-3"></div>
                                            <div class="absolute w-2 h-2 rounded-full bg-white border-2 border-[#0071e3] -left-[29px] top-2"></div>
                                            <div class="pl-4">
                                                <h4 class="text-[15px] font-medium text-[#1d1d1f]">${page.name}</h4>
                                                <p class="text-[13px] text-[#86868b] mt-1 line-clamp-1">${page.features.join(', ')}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                    ${app.pages.length > 5 ? `
                                        <div class="relative pt-2">
                                            <div class="absolute w-6 h-0.5 bg-[#f5f5f7] -left-6 top-5"></div>
                                            <div class="absolute w-2 h-2 rounded-full bg-[#f5f5f7] -left-[29px] top-4"></div>
                                            <div class="pl-4">
                                                <span class="text-[13px] font-medium text-[#0071e3] bg-[#0071e3]/10 px-3 py-1 rounded-full">
                                                    + ${app.pages.length - 5} more modules
                                                </span>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTechView() {
            return `
                <div class="max-w-6xl mx-auto animate-in pb-16">
                    <div class="mb-12">
                        <h2 class="text-3xl font-semibold tracking-tight text-[#1d1d1f] mb-3">Technology Stack</h2>
                        <p class="text-[#86868b] text-[15px] max-w-2xl leading-relaxed">
                            The modern, scalable infrastructure powering the delivery ecosystem. Built for high concurrency, real-time tracking, and seamless user experiences.
                        </p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${TECH_STACK.map(stack => `
                            <div class="bg-white rounded-3xl p-8 border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
                                <div class="flex items-center gap-4 mb-8">
                                    <div class="w-12 h-12 rounded-2xl ${stack.bg}${stack.color} flex items-center justify-center">
                                        <i data-lucide="${stack.icon}" class="w-6 h-6"></i>
                                    </div>
                                    <h3 class="text-[19px] font-semibold tracking-tight text-[#1d1d1f]">${stack.category}</h3>
                                </div>
                                <div class="space-y-5">
                                    ${stack.items.map(item => `
                                        <div class="flex flex-col">
                                            <span class="text-[15px] font-semibold text-[#1d1d1f] mb-1">${item.name}</span>
                                            <span class="text-[14px] text-[#86868b] leading-relaxed">${item.desc}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderWireframesView() {
            const activeApp = APP_DATA.find(a => a.id === activeAppId);
            const activePage = activeApp.pages.find(p => p.id === activePageId) || activeApp.pages[0];

            return `
                <div class="h-full flex flex-col animate-in">
                    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 scrollbar-hide shrink-0">
                        ${activeApp.pages.map(page => `
                            <button onclick="setActivePage('${page.id}')" class="whitespace-nowrap px-4 py-2 rounded-full text-[13px] font-medium transition-all ${activePage.id === page.id ? 'bg-[#1d1d1f] text-white shadow-md' : 'bg-white text-[#515154] hover:bg-[#f5f5f7] border border-black/5'}">
                                ${page.name}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex-1 flex flex-col xl:flex-row gap-12 overflow-hidden pb-8">
                        <div class="flex-1 flex justify-center items-start overflow-y-auto pt-4 px-4 pb-12">
                            ${activeApp.deviceType === 'desktop' ? renderMacMockup(renderTemplate(activePage.template)) : renderIPhoneMockup(renderTemplate(activePage.template))}
                        </div>
                        <div class="w-full xl:w-[400px] shrink-0 space-y-6 overflow-y-auto px-4 xl:px-0 pb-12">
                            <div class="bg-white rounded-3xl p-8 ring-1 ring-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
                                <div class="flex items-center gap-2 text-[12px] font-medium text-[#86868b] mb-3 uppercase tracking-widest">
                                    <span>${activeApp.name}</span>
                                </div>
                                <h2 class="text-2xl font-semibold tracking-tight text-[#1d1d1f] mb-6">${activePage.name}</h2>
                                <div class="flex flex-wrap gap-2 mb-8">
                                    <div class="px-3 py-1 rounded-md text-[12px] font-semibold tracking-wide flex items-center gap-1.5 ${activePage.complexity === 'Complex' ? 'bg-[#ff3b30]/10 text-[#ff3b30]' : activePage.complexity === 'Moderate' ? 'bg-[#ff9500]/10 text-[#ff9500]' : 'bg-[#34c759]/10 text-[#34c759]'}">
                                        <i data-lucide="activity" class="w-3 h-3"></i>
                                        ${activePage.complexity} UI
                                    </div>
                                    <div class="px-3 py-1 rounded-md text-[12px] font-semibold tracking-wide bg-[#f5f5f7] text-[#515154] flex items-center gap-1.5 uppercase">
                                        <i data-lucide="layout-template" class="w-3 h-3"></i>
                                        ${activePage.template}
                                    </div>
                                </div>
                                <div class="space-y-8">
                                    <div>
                                        <h3 class="text-[14px] font-semibold text-[#1d1d1f] mb-4 flex items-center gap-2">
                                            <div class="w-6 h-6 rounded-full bg-[#0071e3]/10 flex items-center justify-center text-[#0071e3]"><i data-lucide="layout-template" class="w-3 h-3"></i></div>
                                            Key Interface Features
                                        </h3>
                                        <ul class="space-y-3">
                                            ${activePage.features.map(feature => `
                                                <li class="flex items-start gap-3 text-[14px] text-[#515154] leading-relaxed">
                                                    <i data-lucide="check-circle-2" class="w-[18px] h-[18px] text-[#0071e3] shrink-0 mt-0.5"></i>
                                                    ${feature}
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                    <div class="h-px w-full bg-black/5"></div>
                                    <div>
                                        <h3 class="text-[14px] font-semibold text-[#1d1d1f] mb-4 flex items-center gap-2">
                                            <div class="w-6 h-6 rounded-full bg-purple-500/10 flex items-center justify-center text-purple-600"><i data-lucide="server" class="w-3 h-3"></i></div>
                                            Backend & Services
                                        </h3>
                                        <div class="flex flex-wrap gap-2">
                                            ${activePage.services.map(service => `
                                                <span class="px-3 py-1.5 bg-[#f5f5f7] border border-black/5 rounded-lg text-[13px] text-[#515154] font-medium flex items-center gap-1.5">
                                                    <i data-lucide="cpu" class="w-3 h-3 text-[#86868b]"></i>
                                                    ${service}
                                                </span>
